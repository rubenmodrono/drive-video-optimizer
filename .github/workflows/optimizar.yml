name: Optimizar vídeos de Drive

# Un trabajo por vídeo: "listar" busca los vídeos pendientes y lanza un
# trabajo independiente para cada uno, todos en paralelo.

on:
  schedule:
    - cron: "0 2 * * *"   # cada noche a las 02:00 UTC
  workflow_dispatch:
    inputs:
      modo:
        description: "simulacion o sustituir"
        default: simulacion
        type: choice
        options: [simulacion, sustituir]
      limite:
        description: "Máximo de vídeos (0 = todos)"
        default: "0"

concurrency:
  group: optimizer
  cancel-in-progress: false

env:
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  MODO: ${{ github.event_name == 'schedule' && vars.MODO_NOCTURNO || inputs.modo }}

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      videos: ${{ steps.lista.outputs.videos }}
      total: ${{ steps.lista.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Buscar vídeos pendientes
        id: lista
        env:
          LIMITE: ${{ inputs.limite || '0' }}
        run: |
          FLAGS=""
          if [ "$MODO" = "sustituir" ]; then FLAGS="--apply"; fi
          python3 optimizer.py --list-json videos.json --limit "$LIMITE" $FLAGS
          echo "videos=$(cat videos.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(python3 -c 'import json;print(len(json.load(open("videos.json"))))')" >> "$GITHUB_OUTPUT"

  optimizar:
    needs: listar
    if: needs.listar.outputs.total != '0'
    name: ${{ matrix.video.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false        # si un vídeo falla, los demás siguen
      max-parallel: 20        # máximo de trabajos simultáneos en el plan gratuito
      matrix:
        video: ${{ fromJSON(needs.listar.outputs.videos) }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg con VMAF
        run: |
          curl -fsSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar xf ff.tar.xz
          echo "$PWD/$(ls -d ffmpeg-*/ | head -1)bin" >> "$GITHUB_PATH"

      - name: Comprobar ffmpeg
        run: ffmpeg -hide_banner -filters | grep -q libvmaf && ffmpeg -version | head -1

      - name: Optimizar ${{ matrix.video.name }}
        env:
          VIDEO_ID: ${{ matrix.video.id }}
        run: |
          FLAGS="--id $VIDEO_ID --summary $GITHUB_STEP_SUMMARY"
          if [ "$MODO" = "sustituir" ]; then FLAGS="$FLAGS --apply"; fi
          python3 optimizer.py $FLAGS

      - name: Guardar informe
        if: always()
        continue-on-error: true   # un fallo al guardar el informe no invalida el vídeo
        uses: actions/upload-artifact@v4
        with:
          name: informe-${{ matrix.video.id }}
          path: informe.json
          if-no-files-found: ignore

  avisar:
    # Aviso al móvil con ntfy (https://ntfy.sh) si existe la variable NTFY_TOPIC
    needs: [listar, optimizar]
    if: always() && needs.listar.outputs.total != '0' && vars.NTFY_TOPIC != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: informe-*
          path: informes
      - name: Enviar aviso
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import glob, json, os, urllib.request
          rs = [r for p in glob.glob("informes/*/informe.json") for r in json.load(open(p))]
          ok = [r for r in rs if r.get("status") == "sustituido"]
          otros = [f"{r['name']} ({r.get('status')})" for r in rs if r.get("status") != "sustituido"]
          gb = sum(r["original"] - r["size"] for r in ok) / 1e9
          msg = f"{len(ok)} vídeos nuevos listos en Drive ({gb:.2f} GB liberados)."
          if ok:
              msg += "\nListos: " + ", ".join(os.path.splitext(r["name"])[0] + ".mp4" for r in ok)
          if otros:
              msg += "\nSin sustituir: " + ", ".join(otros)
          req = urllib.request.Request("https://ntfy.sh/" + os.environ["NTFY_TOPIC"], data=msg.encode(),
                                       headers={"Title": "Contenido nuevo para redes", "Click": os.environ["RUN_URL"],
                                                "Tags": "movie_camera"})
          urllib.request.urlopen(req)
          print(msg)
          PY
